# Standalone Deployment for Single-Module Mode
services:
  inventory_standalone_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_standalone
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  inventory_standalone_backend:
    build:
      context: ../../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8009:8000"
    environment:
      - DB_HOST=inventory_standalone_db
      - DB_NAME=inventory_standalone
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - inventory_standalone_db

