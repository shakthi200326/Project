# ============================================================================
# POSTGRESQL 16 ENTERPRISE CONFIGURATION
# Optimized for High-Concurrency Multi-Schema SaaS & Inventory Operations
# ============================================================================

# Connectivity
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 5

# Memory Optimization (tuned for 4GB-8GB container nodes)
shared_buffers = 1GB
effective_cache_size = 3GB
maintenance_work_mem = 256MB
work_mem = 16MB
temp_buffers = 16MB

# Write-Ahead Log (WAL) & ACID Guarantees
wal_level = replica
synchronous_commit = on
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 512MB

# Query Planner & Worker Threads
random_page_cost = 1.1 # Tuned for SSD / NVMe storage
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# Logging & Auditing
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 250 # Log queries exceeding 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_temp_files = 0

# Locale & Formatting
datestyle = 'iso, ymd'
timezone = 'UTC'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
