services:
  postgres:
    image: postgres:16-alpine
    container_name: ecosystem_postgres
    environment:
      POSTGRES_DB: ecosystem_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecosystem_redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    container_name: ecosystem_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data

  inventory_backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: ecosystem_inventory_backend
    command: python modules/inventory/backend/manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8008}:8000"
    environment:
      - ENVIRONMENT=development
      - DB_HOST=postgres
      - DB_NAME=ecosystem_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - STORAGE_PROVIDER=minio
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory_worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: ecosystem_inventory_worker
    command: celery -A modules.inventory.backend.config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DB_HOST=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - inventory_backend

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: ecosystem_inventory_frontend
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - .:/app
      - /app/modules/inventory/frontend/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8008/api/v1
    depends_on:
      - inventory_backend

  nginx:
    image: nginx:alpine
    container_name: ecosystem_nginx_gateway
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - inventory_backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  minio_data:

