# ============================================================================
# PROMETHEUS METRIC SCRAPING CONFIGURATION
# ============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "inventory_backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["inventory_backend:8000"]

  - job_name: "postgres_exporter"
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: "redis_exporter"
    static_configs:
      - targets: ["redis:6379"]

