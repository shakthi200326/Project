# ============================================================================
# REDIS 7 ENTERPRISE IN-MEMORY CACHE & CELERY BROKER CONFIGURATION
# ============================================================================

# Network & Connectivity
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence (AOF for reliable Celery task queuing)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Performance Tuning
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes

